<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Fundo circular azul escuro -->
  <circle cx="32" cy="32" r="32" fill="#1a3a6e"/>

  <!-- Anel exterior -->
  <circle cx="32" cy="32" r="29" fill="none" stroke="#2563eb" stroke-width="2.5"/>

  <!-- Barras de gráfico (crescentes, estilo logo) -->
  <!-- Barra 1 - pequena -->
  <rect x="14" y="34" width="7" height="12" rx="1.5" fill="#2e86de"/>
  <!-- Barra 2 - média -->
  <rect x="23" y="27" width="7" height="19" rx="1.5" fill="#2e86de"/>
  <!-- Barra 3 - grande -->
  <rect x="32" y="19" width="7" height="27" rx="1.5" fill="#2e86de"/>

  <!-- Seta de tendência crescente -->
  <polyline points="14,38 24,30 33,23 43,16" fill="none" stroke="#60adf5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Ponta da seta -->
  <polyline points="38,15 43,16 42,21" fill="none" stroke="#60adf5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Letra W estilizada em baixo -->
  <text x="32" y="57" text-anchor="middle"
        font-family="Arial Black, sans-serif"
        font-weight="900" font-size="10"
        fill="#60adf5" letter-spacing="1">LF</text>
</svg>
